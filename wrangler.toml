# Cloudflare Workers configuration for IKF Pathway 360.
# Currently a SCAFFOLD — bindings + cron triggers + secret names declared so
# that a future `wrangler deploy` knows what to provision, but the Workers
# build target (Vite plugin + entry module) is not yet wired in `vite.config.ts`.
# That swap is the final Phase 3 step.
#
# Region targeting: not declared here — Workers auto-distributes globally and
# routes each request to the nearest POP (Mumbai/Hyderabad for Indian users).
# R2 has APAC location hint set at bucket creation; D1 location hint TBD when
# the D1 database is created via `wrangler d1 create ikf-pathway --location apac`.

name = "ikf-pathway-360"
main = "src/server.ts"
compatibility_date = "2026-05-27"
compatibility_flags = ["nodejs_compat"]

# ---- Bindings ----

# D1: relational database (SQLite under the hood, same schema as local dev).
# Create with:  wrangler d1 create ikf-pathway --location apac
# Then paste the returned database_id below and run:
#   wrangler d1 migrations apply ikf-pathway --remote
# (wrangler reads db/migrations/*.sql by default if `migrations_dir` is set.)
[[d1_databases]]
binding = "DB"
database_name = "ikf-pathway"
database_id = "REPLACE_AFTER_wrangler_d1_create"
migrations_dir = "db/migrations"

# R2: object storage for assessment uploads. Already provisioned in APAC.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "ikf-pathway-uploads"

# ---- Cron triggers ----
# Same cadence as the current vercel.json crons. Workers Cron Triggers fire
# the worker's `scheduled()` export, so the HTTP routes in
# src/routes/api.cron.*.ts will need to move to that handler. See the
# "Phase 3 hand-off" section in docs/platform-status.md.

[triggers]
crons = [
  "0 9 * * *",   # 09:00 UTC — review-reminders
  "30 9 * * *",  # 09:30 UTC — stage2-nudge
]

# ---- Vars (non-secret env, baked into bundle at deploy) ----
[vars]
APP_BASE_URL = "https://ikf-pathway-360.workers.dev"  # change to custom domain post-launch

# ---- Secrets (NOT in this file — set via `wrangler secret put` per env) ----
# Each of these must be set before the worker can serve:
#   wrangler secret put SMTP2GO_API_KEY
#   wrangler secret put EMAIL_FROM
#   wrangler secret put ADVISOR_EMAIL
#   wrangler secret put CRON_SECRET
#   wrangler secret put R2_ACCESS_KEY_ID         # only if R2 used via S3 SDK
#   wrangler secret put R2_SECRET_ACCESS_KEY     # ditto — preferred is the R2 binding above
#   wrangler secret put R2_ACCOUNT_ID            # ditto
#
# The CURRENT_CONSENT_VERSION constant is in code, not env — bumping it is a code change.
